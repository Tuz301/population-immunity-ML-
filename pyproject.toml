[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immunity-engine"
version = "0.1.0"
description = "How many campaign rounds reach population immunity, and where no number will"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
council = ["anthropic>=0.40"]
postgres = ["psycopg[binary]>=3.1", "sqlalchemy>=2.0"]
dev = ["pytest>=7.4"]

[project.scripts]
immunity-engine = "immunity_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
